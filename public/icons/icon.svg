<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#18182c"/>
      <stop offset="100%" stop-color="#080811"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B20"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Outer Sacred Gold Geometric Frame -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGrad)" stroke-width="8" filter="url(#goldGlow)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6,6" stroke-opacity="0.6"/>

  <!-- Sacred Om (ॐ) Glyph -->
  <text 
    x="256" 
    y="330" 
    text-anchor="middle" 
    font-family="'Noto Sans Devanagari', 'Sanskrit Text', 'Arial Unicode MS', sans-serif" 
    font-size="240" 
    font-weight="bold" 
    fill="url(#goldGrad)"
    filter="url(#goldGlow)"
  >
    ॐ
  </text>
</svg>
